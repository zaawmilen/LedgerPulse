version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ledgerpulse_dev
    ports:
      - "5432:5432"
    volumes:
      - ledgerpulse_pgdata:/var/lib/postgresql/data

volumes:
  ledgerpulse_pgdata:
